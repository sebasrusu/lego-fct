apiVersion: apps/v1
kind: Deployment
metadata:
  name: legoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legoapp
  template:
    metadata:
      labels:
        app: legoapp
    spec:
      containers:
        - name: legoapp
          image: cc2526acr.azurecr.io/lego-webapp:v1
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: media-volume
              mountPath: /media
      volumes:
        - name: media-volume
          persistentVolumeClaim:
            claimName: media-pvc
