apiVersion: apps/v1
kind: Deployment
metadata:
  name: lego-webapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lego-webapp
  template:
    metadata:
      labels:
        app: lego-webapp
    spec:
      containers:
      - name: webapp
        image: cc2526acr.azurecr.io/lego-webapp:v1
        ports:
        - containerPort: 8080
        env:
        # --- REDIS LOCAL (K8s Service) ---
        # Este não é sensível, aponta para o serviço interno
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: REDIS_KEY
          value: ""
        
        # --- VARIAVEIS SENSIVEIS (Vêm do Secret 'lego-app-secrets') ---
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: lego-app-secrets
              key: DB_URL
        - name: DB_KEY
          valueFrom:
            secretKeyRef:
              name: lego-app-secrets
              key: DB_KEY
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: lego-app-secrets
              key: DB_NAME
        - name: BlobStoreConnection
          valueFrom:
            secretKeyRef:
              name: lego-app-secrets
              key: BlobStoreConnection
        - name: AZURE_STORAGE_CONTAINER
          valueFrom:
            secretKeyRef:
              name: lego-app-secrets
              key: AZURE_STORAGE_CONTAINER

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /rest/ctrl/version
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lego-webapp-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: lego-webapp
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP