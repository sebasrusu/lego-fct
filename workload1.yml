config:
  target: 'https://cc2526.azurewebsites.net'
  http:
    timeout: 10
  plugins:
    metrics-by-endpoint:
      useOnlyRequestNames: true
  processor: "./test-utils.js"
  phases:
  - name: "Warm up"
    arrivalRate: 1         
    duration: 1
  - name: "Test"
    arrivalRate: 5      # You need to control this parameter based on your backend         
    duration: 20

scenarios:
  - name: 'User checks own auctions'
    weight: 5
    flow:
      - function: "selectUserSkewed"
      - post:
          url: "/rest/user/auth"
          headers:
            Content-Type: application/json
          json:
            user: "{{ uId }}"
            pwd: "{{ uPwd }}"
      - get:
          url: "/rest/auction?recent=true&st=0&len=20"
          headers:
            Accept: application/json
      - get:
          url: "/rest/legoset?recent=true&st=0&len=20"
          headers:
            Accept: application/json
      - get:
          url: "/rest/user/{{ uId }}/auctions"
          headers:
            Accept: application/json
          capture: 
            json: "$"
            as: "auctionsLst"
      - loop:
        - get:
            url: "/rest/legoset/{{ $loopElement.legoSetId }}"
            headers:
              Accept: application/json
            capture: 
              json: "$"
              as: "legoSetInfo"
        - get:
            url: "/rest/media/{{ legoSetInfo.photoIds[0] }}"
            headers:
              Accept: image/jpeg
              # Get bids if separate URL
        #- get:                          # Get bids for auction
        #    url: "/auction/{{ $loopElement.id }}/bids"
        #  headers:
        #    Accept: application/json
        over: "auctionsLst"

  - name: 'Troll browsing'
    weight: 2000
    flow:
      - function: "selectUserSkewed"
      - post:
          url: "/rest/user/auth"
          headers:
            Content-Type: application/json
          json:
            user: "{{ uId }}"
            pwd: "{{ uPwd }}"
      - get:
          url: "/rest/auction?recent=true&st=0&len=20"
          headers:
            Accept: application/json
          capture: 
            json: "$"
            as: "auctionsLst"
      - get:
          url: "/rest/legoset?recent=true&st=0&len=20"
          headers:
            Accept: application/json
          capture: 
            json: "$"
            as: "legoSetLst"
      - loop:
        - function: "genProductCommentLoop"
        - function: "random20"
        - post:
            url: "/rest/legoset/{{ $loopElement.id }}/comment"
            headers:
              Content-Type: application/json
              Accept: application/json
            json:
              legoSetId: "{{ $loopElement.id }}"
              userId: "{{ uId }}"
              text: "{{ cmtText }}"
            ifTrue: "randomValue"
        over: "legoSetLst"

  - name: 'Mixed Browsing'
    weight: 40
    flow:
      - function: "selectUserMain"
      - post:
          url: "/rest/user/auth"
          headers:
            Content-Type: application/json
          json:
            user: "{{ uId }}"
            pwd: "{{ uPwd }}"
      - loop:
        - get:
            url: "/rest/auction?recent=true&st=0&len=20"
            headers:
              Accept: application/json
            capture: 
              json: "$"
              as: "auctionsLst"
        - get:
            url: "/rest/legoset?recent=true&st=0&len=20"
            headers:
              Accept: application/json
            capture: 
              json: "$"
              as: "legoSetLst"
        - function: "decideNextAction"
        - get:
            url: "/rest/legoset?recent=true&st={{ stLegoSets }}&len=20"
            headers:
              Accept: application/json
            capture: 
              json: "$"
              as: "legoSetLst"
            ifTrue: "nextAction == 1"
        - get:
            url: "/rest/auction?recent=true&st={{ stAuctions }}&len=20"
            headers:
              Accept: application/json
            capture: 
              json: "$"
              as: "auctionsLst"
            ifTrue: "nextAction == 2"
        - get:
            url: "/rest/user/{{ uId }}"
            headers:
              Content-Type: application/json
            capture: 
              json: "$"
              as: "userInfo"
            ifTrue: "nextAction == 3 or nextAction == 4"
        - loop:
          - get:
              url: "/rest/legoset/{{ $loopElement }}"
              headers:
                Accept: application/json
              ifTrue: "nextAction == 3 or nextAction == 4"
          over: "userInfo.legoIds"
        - post:
            url: "/rest/media"
            headers:
              Content-Type: image/jpeg
              Accept: application/json
            beforeRequest: "uploadImageBody"
            capture: 
              regexp: "(.+)"
              as: "imageId"              # capture the reply as image id to be used in legoset creation
            ifTrue: "nextAction == 5"
        - function: "genNewLegoSet"
        - post:
            url: "/rest/legoset"
            headers:
              Content-Type: application/json
              Accept: application/json
            json:
              name: "{{ lsName }}"
              description: "{{ lsDescription }}"
              photoIds: ["{{ imageId }}"]
            capture: 
              json: "$.id"
              as: "lsId"              # capture the legoset id to be used in adding legosets to users
            ifTrue: "nextAction == 5"
        - function: "selectLegoSetFromUserInfo"
        - get:
            url: "/rest/legoset/{{ lsId }}"
            headers:
              Accept: application/json
            capture: 
              json: "$.id"
              as: "lsId"
            ifTrue: "afterNextAction == 13"
        - function: "genNewOldAuction"
        - post:
            url: "/rest/auction"
            headers:
              Content-Type: application/json
              Accept: application/json
            json:
                legoSetId: "{{ lsId }}"
                seller: "{{ uIdMain }}"
                startingPrice: "{{ aucStartingPrice }}"
                endDate: "{{ aucEndDate }}"
            capture: 
              json: "$.id"
              as: "aucId"         # capture the auction id to be used in bid creation creation
            ifTrue: "afterNextAction == 13"
        - function: "selectLegoSet"
        - get:
            url: "/rest/legoset/{{ lsId }}"
            headers:
              Accept: application/json
            ifTrue: "afterNextAction == 10 and lsId"
        - function: "genProductComment"
        - post:
            url: "/rest/legoset/{{ lsId }}/comment"
            headers:
              Content-Type: application/json
              Accept: application/json
            json:
              legoSetId: "{{ lsId }}"
              user: "{{ uIdMain }}"
              text: "{{ cmtText }}"
            ifTrue: "afterNextAction == 10 and lsId"
        - function: "selectLegoSet"
        - get:
            url: "/rest/legoset/{{ lsId }}/comments?st=0&len=20"
            headers:
              Accept: application/json
            ifTrue: "afterNextAction == 14 and lsId"
        - patch:
            url: "/rest/user/{{ uIdMain }}"
            headers:
              Content-Type: application/json
              Accept: application/json
            json:
              legoIds: ["{{ lsId }}"]
            ifTrue: "afterNextAction == 14 and lsId"
        - function: "selectAuction"
        - post:
            url: "/rest/auction/{{ aucId }}/bid"
            headers:
              Content-Type: application/json
              Accept: application/json
            json:
              auctionId: "{{ aucId }}"
              userId: "{{ uIdMain }}"
              amount: "{{ aucLastBid }}"
            ifTrue: "afterNextAction == 11 and aucId"
        whileTrue: "randomLoop90"
