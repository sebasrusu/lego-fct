version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: lego-postgres
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_PASSWORD: senhaSegura123
      POSTGRES_USER: admin
      POSTGRES_DB: legoapp
      POSTGRES_PORT: 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d legoapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lego-network

  redis:
    image: redis:7-alpine
    container_name: lego-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lego-network

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lego-webapp
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legoapp
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: senhaSegura123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-storage:/app/media
    networks:
      - lego-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  media-storage:
    driver: local

networks:
  lego-network:
    driver: bridge