version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: lego-mongo
    platform: linux/amd64
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: senhaSegura123
      MONGO_INITDB_DATABASE: ccdb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "admin", "--password", "senhaSegura123", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lego-network

  redis:
    image: redis:7-alpine
    container_name: lego-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lego-network

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lego-webapp
    environment:
      DB_URL: mongodb://admin:senhaSegura123@mongo:27017/ccdb?authSource=admin
      DB_NAME: ccdb
      DB_KEY: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-storage:/app/media
    networks:
      - lego-network
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  media-storage:
    driver: local

networks:
  lego-network:
    driver: bridge